<div class="card w-full p-4">
	<form [formGroup]="frmInsertSuggestion">
		<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-3">
			<div class="flex flex-col gap-2">
				<label for="txtPersonFullName" class="font-medium">Nombre completo de quien sugiere</label>
				<input pInputText id="txtPersonFullName" formControlName="personFullName" class="w-full"/>
				@if((personFullNameFb.touched || personFullNameFb.dirty) && personFullNameFb.errors && personFullNameFb.hasError('required')) {
					<small class="errorMessage">Campo requerido.</small>
				}
			</div>
			<div class="flex flex-col gap-2">
				<label for="txtIdOffice" class="font-medium">Oficina*</label>
				<input pInputText id="txtIdOffice" formControlName="idOffice" readonly class="w-full" />
			</div>
		</div>
		<div class="grid grid-cols-1 gap-4 mb-3">
			<div class="flex flex-col gap-2">
				<label for="txtDescription" class="font-medium">Descripción de la sugerencia*</label>
				<textarea pTextarea id="txtDescription" formControlName="description" rows="5" class="w-full"></textarea>
				@if((descriptionFb.touched || descriptionFb.dirty) && descriptionFb.errors && descriptionFb.hasError('required')) {
					<small class="errorMessage">Campo requerido.</small>
				}
			</div>
		</div>
		<hr>
		<div class="card flex justify-end mt-3">
			<p-button label="Registrar datos ingresados" (click)="sendInsertSuggestion($event)" />
		</div>
	</form>
</div>
