<p-toast />
<p-confirmdialog />
<div class="layout-container">
	<header class="layout-topbar">
		<div class="topbar-left">
			<p-button icon="pi pi-bars" [text]="true" severity="contrast" (onClick)="toggleSidebar()" />
			<span class="app-logo">EPIIS</span>
		</div>
		<div class="topbar-right">
			<p-button icon="pi pi-bell" [text]="true" severity="contrast" badge="2" badgeSeverity="danger" />
			<div class="user-profile" (click)="menu.toggle($event)">
				<p-avatar image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png" shape="circle" />
				<span class="username">Admin</span>
				<i class="pi pi-angle-down"></i>
			</div>
			<p-menu #menu [model]="profileItems" [popup]="true" />
		</div>
	</header>
	<div class="layout-body">
		<p-drawer [(visible)]="sidebarVisible" header="Menú de Navegación">
		<div class="sidebar-content">
			<ul class="nav-list">
			@for(item of navItems; track item.label) {
				<li>
					<a [routerLink]="item.routerLink" class="nav-link" routerLinkActive="active-link" (click)="sidebarVisible.set(false)">
						<i [class]="item.icon"></i>
						<span>{{ item.label }}</span>
					</a>
				</li>
			}
			</ul>
		</div>
		</p-drawer>
		<main class="layout-main">
			<div class="content-wrapper">
				<router-outlet />
			</div>
		</main>
	</div>
</div>
